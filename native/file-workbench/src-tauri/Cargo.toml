[package]
name = "file-workbench"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
tauri-codegen = "=2.6.3"

[dependencies]
serde_json = "1"
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-dialog = "~2.7"
tauri-plugin-single-instance = "2"
nine-rings-file-host = { path = "../../file-host" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSResponder", "NSEvent", "NSView", "NSControl", "NSButton", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
block2 = "0.6"
