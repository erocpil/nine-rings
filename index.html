<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/ragdoll-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3949ab" />
    <meta name="description" content="Nine Rings — 跨平台便签" />
    <link rel="manifest" href="/manifest.json" />
    <title>Nine Rings</title>
    <style>
      /* 在应用脚本和完整样式下载、解析期间立即提供首帧，避免移动端冷启动白屏。 */
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { overflow: hidden; background: #fff; }
      .nr-boot-shell {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        background: #fff;
        color: #656d76;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .nr-boot-content { display: grid; justify-items: center; gap: 14px; }
      .nr-boot-mark { position: relative; width: 42px; height: 22px; }
      .nr-boot-mark::before,
      .nr-boot-mark::after {
        position: absolute;
        top: 0;
        width: 18px;
        height: 18px;
        border: 2px solid #3949ab;
        border-radius: 50%;
        content: "";
      }
      .nr-boot-mark::before { left: 1px; }
      .nr-boot-mark::after { right: 1px; }
      .nr-boot-progress {
        width: 96px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: #e8eaf6;
      }
      .nr-boot-progress::after {
        display: block;
        width: 45%;
        height: 100%;
        border-radius: inherit;
        background: #3949ab;
        content: "";
        animation: nr-boot-progress 1s ease-in-out infinite alternate;
      }
      @keyframes nr-boot-progress { to { transform: translateX(122%); } }
      @media (prefers-color-scheme: dark) {
        body, .nr-boot-shell { background: #0d1117; color: #8b949e; }
        .nr-boot-mark::before, .nr-boot-mark::after { border-color: #58a6ff; }
        .nr-boot-progress { background: #21262d; }
        .nr-boot-progress::after { background: #58a6ff; }
      }
      @media (prefers-reduced-motion: reduce) {
        .nr-boot-progress::after { width: 100%; animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="nr-boot-shell" role="status" aria-label="正在打开上次文档">
        <div class="nr-boot-content">
          <span class="nr-boot-mark" aria-hidden="true"></span>
          <span>正在打开上次文档…</span>
          <span class="nr-boot-progress" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
