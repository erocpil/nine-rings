name: Test
on: [push, pull_request]

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      flutter: ${{ steps.filter.outputs.flutter }}
      rust: ${{ steps.filter.outputs.rust }}
      schema: ${{ steps.filter.outputs.schema }}
      ipc: ${{ steps.filter.outputs.ipc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'e2e/**'
              - 'tests/**'
              - 'public/**'
              - 'plugins/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'vitest.config.ts'
              - 'playwright.config.ts'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'index.html'
              - '.github/workflows/test.yml'
            flutter:
              - 'flutter_app/**'
            rust:
              - 'src-tauri/**'
              - 'schema/**'
              - 'Cargo.lock'
            schema:
              - 'schema/**'
              - 'src-tauri/src/db/schema_gen.rs'
              - 'src/types/schema_gen.ts'
              - 'flutter_app/lib/database/schema_gen.dart'
              - 'scripts/gen-schema.py'
            ipc:
              - 'src-tauri/src/**'
              - 'src/lib/storage/tauri.ts'
              - 'src/lib/storage/tauri-driver.ts'
              - 'scripts/check-ipc-contract.py'

  frontend:
    name: Frontend Tests
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

  flutter-quality:
    name: Flutter Tests and Format
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- '*.dart' | sed 's#^flutter_app/##')
          if (( ${#files[@]} )); then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          fi
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ipc-contract:
    name: Tauri IPC Contract Check
    needs: changes
    if: ${{ needs.changes.outputs.ipc == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-ipc-contract.py

  schema-check:
    name: Schema Consistency Check (YAML → codegen)
    needs: changes
    if: ${{ needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install PyYAML
      - name: Check schema-generated files are up to date
        run: python3 scripts/gen-schema.py --check

  rust:
    name: Rust Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cd src-tauri && cargo test
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo clippy --all-targets --all-features -- -D warnings

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install chromium webkit --with-deps
      - run: npm run test:e2e
      - name: Cross-platform touch interaction smoke tests (WebKit)
        run: npm run test:e2e:cross-platform
