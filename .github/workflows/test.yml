name: Test
on:
  push:
  pull_request:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: "Full E2E including production/PWA, or affected tests"
        type: choice
        options: [full, affected]
        default: full
      base:
        description: "Optional base commit SHA for affected mode; unavailable history falls back to full"
        type: string
        required: false

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      production: ${{ steps.filter.outputs.production }}
      flutter: ${{ steps.filter.outputs.flutter }}
      rust: ${{ steps.filter.outputs.rust }}
      schema: ${{ steps.filter.outputs.schema }}
      ipc: ${{ steps.filter.outputs.ipc }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
        id: filter
        with:
          filters: |
            frontend:
              - 'schema/sync/**'
              - '.node-version'
              - 'src/**'
              - 'e2e/**'
              - 'scripts/e2e-suites.mjs'
              - 'scripts/run-e2e-ci.mjs'
              - 'tests/**'
              - 'public/**'
              - 'plugins/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - 'vitest.config.ts'
              - 'playwright*.config.ts'
              - 'vite.config.*'
              - 'tsconfig*.json'
              - 'index.html'
              - '.github/workflows/test.yml'
            production:
              - 'public/**'
              - 'vite.config.*'
              - 'index.html'
              - 'package*.json'
              - 'src/App.tsx'
              - 'src/lib/runtime.ts'
              - 'src/lib/pwa*'
              - 'src/hooks/usePwa*'
              - 'src/hooks/usePWA*'
              - 'src/components/Pwa*'
              - 'src/components/PWA*'
              - 'e2e/pwa-offline.spec.ts'
              - 'e2e/pwa-update.spec.ts'
              - 'e2e/settings-search-production.spec.ts'
              - 'e2e/toolbar-overflow-production.spec.ts'
              - 'e2e/search-production.spec.ts'
              - 'playwright.pwa.config.ts'
              - 'scripts/e2e-suites.mjs'
              - '.github/workflows/test.yml'
            flutter:
              - 'flutter_app/**'
              - 'schema/sync/**'
            rust:
              - 'rust-toolchain.toml'
              - 'src-tauri/**'
              - 'schema/**'
              - 'Cargo.lock'
            schema:
              - 'schema/**'
              - 'src-tauri/src/db/schema_gen.rs'
              - 'src/types/schema_gen.ts'
              - 'flutter_app/lib/database/schema_gen.dart'
              - 'scripts/gen-schema.py'
            ipc:
              - 'src-tauri/src/**'
              - 'src/lib/storage/tauri.ts'
              - 'src/lib/storage/tauri-driver.ts'
              - 'src/lib/storage/template-tauri.ts'
              - 'src/lib/storage/native-search-rebuild.ts'
              - 'scripts/check-ipc-contract.py'

  frontend:
    name: Frontend Tests
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:coverage
      - name: Dependency audit
        run: npm audit --audit-level=high

  flutter-quality:
    name: Flutter Tests and Format
    needs: changes
    if: ${{ needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- '*.dart' | sed 's#^flutter_app/##')
          if (( ${#files[@]} )); then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          fi
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  ipc-contract:
    name: Tauri IPC Contract Check
    needs: changes
    if: ${{ needs.changes.outputs.ipc == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-ipc-contract.py

  schema-check:
    name: Schema Consistency Check (YAML → codegen)
    needs: changes
    if: ${{ needs.changes.outputs.schema == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: pip install PyYAML
      - name: Check schema-generated files are up to date
        run: python3 scripts/gen-schema.py --check

  rust:
    name: Rust Tests
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cd src-tauri && cargo test --locked
      - run: cd src-tauri && cargo fmt --check
      - run: cd src-tauri && cargo clippy --locked --all-targets --all-features -- -D warnings

  reading-workspace-regressions:
    name: Reading workspace (${{ matrix.browser }})
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install ${{ matrix.browser }} --with-deps
      - name: Reading state, navigation and complete virtual reader coverage
        run: npm run test:e2e:reading -- --browser=${{ matrix.browser }} --reporter=line
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reading-workspace-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    needs: changes
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
      - run: npm ci
      - name: Install browsers
        id: browsers
        run: npx playwright install chromium webkit --with-deps
      - name: Core and affected E2E (full on schedule, manual request or unknown paths)
        run: npm run test:e2e:ci -- --reporter=line,json --output=test-results/default
        env:
          NR_E2E_CHANGED_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}
          NR_E2E_FULL: ${{ github.event_name == 'schedule' || inputs.suite == 'full' }}
          NR_E2E_READING_SEPARATE: 'true'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/default.json
      - name: Preserve default E2E failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-default
          path: |
            test-results/default/
            test-results/default.json
          retention-days: 7
      - name: WebKit risk gates (one invocation, no duplicate reading cases)
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' }}
        run: npm run test:e2e:webkit -- --reporter=line,json --output=test-results/webkit
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/webkit.json
      - name: Full production/PWA gate
        if: ${{ !cancelled() && steps.browsers.outcome == 'success' && (github.event_name == 'schedule' || inputs.suite == 'full' || needs.changes.outputs.production == 'true') }}
        run: |
          npm run build
          npx playwright test --config=playwright.pwa.config.ts --browser=chromium --workers=1 --reporter=line,json --output=test-results/production
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/production.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-gates
          path: test-results/
          retention-days: 7
