name: Tauri Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tauri-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          # Match the last successful Windows build; upgrade deliberately so
          # a moving stable channel does not unexpectedly invalidate the cache.
          toolchain: '1.98.1'

      - name: Resolve Rust dependencies
        # Cargo.lock is currently ignored by this repository. Resolve before
        # cache lookup so its key reflects the actual dependency graph.
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: 'src-tauri -> target'
          key: windows-release-v1
          cache-bin: false
          cache-workspace-crates: false
          # PRs may restore the main-branch cache, but only successful main
          # builds publish caches. The app and its embedded assets rebuild.
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (release)
        run: npx tauri build --bundles nsis -- --locked

      - name: Verify Windows bundle
        shell: pwsh
        run: |
          $nsis = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe
          if (-not $nsis) { throw "Missing NSIS bundle" }
          @($nsis) | ForEach-Object {
            if ($_.Length -lt 1MB) { throw "Bundle is unexpectedly small: $($_.FullName)" }
          }

      - name: Collect artifacts
        shell: bash
        run: |
          BUNDLE=src-tauri/target/release/bundle
          echo "=== Bundle tree ==="
          find "$BUNDLE" -type f -ls 2>/dev/null || echo "Bundle dir not found"
          mkdir -p artifacts
          if ls "$BUNDLE/nsis/"*.exe 2>/dev/null; then
            cp -v "$BUNDLE/nsis/"*.exe artifacts/
          fi
          ls -lh artifacts/

      - name: Publish Windows prerelease
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="windows-ci-$SHORT_SHA"
          TITLE="Nine Rings Windows $SHORT_SHA"
          NOTES="Windows Tauri CI build for commit $GITHUB_SHA."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
