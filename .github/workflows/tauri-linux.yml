name: Tauri Linux Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tauri-linux:
    timeout-minutes: 60
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"
          key: linux-x86_64-release-v1
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libegl1-mesa libegl1 \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Check transient download retry policy
        run: bash scripts/ci/test-build-tauri-with-retry.sh

      - name: Build Tauri (release)
        run: bash scripts/ci/build-tauri-with-retry.sh --target x86_64-unknown-linux-gnu --bundles deb,appimage -- --locked
        env:
          # Skip the default artifact upload built into tauri-action
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List and package artifacts
        run: |
          BUNDLE=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          echo "=== Bundle tree ==="
          find "$BUNDLE" -type f -ls 2>/dev/null || echo "Bundle dir not found"
          echo "=== Binary check ==="
          file src-tauri/target/x86_64-unknown-linux-gnu/release/nine-rings 2>/dev/null || echo "Binary not found"
          echo "=== Copying deb artifact ==="
          mkdir -p artifacts
          if ls "$BUNDLE/deb/"*.deb 2>/dev/null; then
            cp "$BUNDLE/deb/"*.deb artifacts/
          fi
          echo "=== Rebundle AppImage with EGL ==="
          if ls "$BUNDLE/appimage/"*.AppImage 2>/dev/null; then
            APPIMAGE=$(ls "$BUNDLE/appimage/"*.AppImage | head -1)
            chmod +x "$APPIMAGE"
            # Extract
            "$APPIMAGE" --appimage-extract
            # Inject Mesa EGL + GL libraries into the payload
            mkdir -p squashfs-root/usr/lib
            cp -v /usr/lib/x86_64-linux-gnu/libEGL.so.1 squashfs-root/usr/lib/
            cp -v /usr/lib/x86_64-linux-gnu/libGL.so.1 squashfs-root/usr/lib/
            cp -v /usr/lib/x86_64-linux-gnu/libGLX.so.0 squashfs-root/usr/lib/ 2>/dev/null || true
            cp -v /usr/lib/x86_64-linux-gnu/libGLdispatch.so.0 squashfs-root/usr/lib/ 2>/dev/null || true
            # Extraction may retain owner-only modes. The portable payload
            # must be readable/traversable by users other than the builder;
            # preserve which regular files are executable without adding write access.
            chmod -R a+rX squashfs-root
            # Fetch the same tools explicitly with bounded retries. In particular,
            # appimagetool's implicit runtime download has no retry budget.
            download_appimage_asset() {
              curl --fail --location --retry 5 --retry-delay 3 --retry-max-time 180 \
                --connect-timeout 20 --max-time 120 "$1" --output "$2"
            }
            download_appimage_asset \
              https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
              appimagetool-x86_64.AppImage
            APPIMAGE_RUNTIME="$RUNNER_TEMP/nine-rings-appimage-runtime-x86_64"
            download_appimage_asset \
              https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
              "$APPIMAGE_RUNTIME"
            file "$APPIMAGE_RUNTIME" | grep -Eq 'ELF 64-bit.*x86-64'
            chmod +x appimagetool-x86_64.AppImage
            ./appimagetool-x86_64.AppImage --no-appstream --comp zstd --runtime-file "$APPIMAGE_RUNTIME" \
              squashfs-root "$BUNDLE/appimage/Nine_Rings-egl.AppImage"
            # Exercise the generated runtime and SquashFS codec before publishing.
            REBUILT_APPIMAGE=$(realpath "$BUNDLE/appimage/Nine_Rings-egl.AppImage")
            APPIMAGE_VERIFY_DIR=$(mktemp -d)
            (cd "$APPIMAGE_VERIFY_DIR" && "$REBUILT_APPIMAGE" --appimage-extract > /dev/null)
            test -f "$APPIMAGE_VERIFY_DIR/squashfs-root/usr/lib/libEGL.so.1"
            test -x "$APPIMAGE_VERIFY_DIR/squashfs-root/AppRun"
            rm -rf "$APPIMAGE_VERIFY_DIR"
            cp -v "$BUNDLE/appimage/Nine_Rings-egl.AppImage" artifacts/
            ls -lh artifacts/
          else
            echo "No AppImage found, checking for binary only..."
            ls -lh src-tauri/target/x86_64-unknown-linux-gnu/release/nine-rings 2>/dev/null || true
          fi
          for artifact in artifacts/*; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nine-rings-tauri-linux-x86_64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish Linux x86_64 prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="linux-x86_64-ci-$SHORT_SHA"
          TITLE="Nine Rings Linux x86_64 $SHORT_SHA"
          NOTES="Linux x86_64 Tauri CI build for commit $GITHUB_SHA.

          Includes Debian package and portable AppImage. SHA-256 checksums are attached."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
