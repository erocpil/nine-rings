name: Artifact Cleanup

on:
  workflow_run:
    workflows:
      - Tauri Windows Build
      - Tauri macOS Build
      - Tauri Linux Build
      - Flutter Windows Build
      - Flutter macOS Build
      - Flutter Linux Build
    types: [completed]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: artifact-cleanup
  cancel-in-progress: true

permissions:
  actions: write
  contents: write

jobs:
  prune:
    name: Keep latest artifact per name
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          declare -A kept=()
          deleted=0

          while IFS=$'\t' read -r created_at artifact_id artifact_name; do
            if [[ -z "$artifact_id" || -z "$artifact_name" ]]; then
              continue
            fi

            case "$artifact_name" in
              nine-rings-tauri-windows-x64 | \
              nine-rings-tauri-linux-x86_64 | \
              nine-rings-tauri-macos-arm64 | \
              nine-rings-tauri-macos-x64 | \
              nine-rings-flutter-windows-x64 | \
              nine-rings-flutter-linux-x64 | \
              nine-rings-flutter-macos-arm64)
                ;;
              *)
                if gh api \
                  --method DELETE \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
                  --silent; then
                  echo "Deleted legacy $artifact_name ($artifact_id, $created_at)"
                  ((deleted += 1))
                fi
                continue
                ;;
            esac

            if [[ -z "${kept[$artifact_name]+x}" ]]; then
              kept["$artifact_name"]="$artifact_id"
              echo "Keeping $artifact_name ($artifact_id, $created_at)"
              continue
            fi

            if gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" \
              --silent; then
              echo "Deleted superseded $artifact_name ($artifact_id, $created_at)"
              ((deleted += 1))
            else
              echo "Artifact $artifact_id was already deleted by another cleanup run"
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.created_at, .id, .name] | @tsv' |
              sort -r
          )

          echo "Kept ${#kept[@]} latest current artifacts; deleted $deleted legacy or superseded artifacts"

  prune-ci-releases:
    name: Keep latest 2 CI prereleases
    runs-on: ubuntu-latest
    steps:
      - name: Delete superseded CI prereleases by platform prefix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          retained_per_prefix=2
          explicit_prefixes=(
            "windows-ci-"
            "macos-arm64-ci-"
            "macos-x64-ci-"
            "linux-x86_64-ci-"
          )

          for prefix in "${explicit_prefixes[@]}"
          do
            kept=0
            deleted=0

            while IFS=$'\t' read -r published_at release_id tag_name; do
              if [[ -z "$release_id" || -z "$tag_name" ]]; then
                continue
              fi
              if [[ "$tag_name" != "${prefix}"* ]]; then
                continue
              fi

              if (( kept < retained_per_prefix )); then
                echo "Keeping $tag_name ($published_at)"
                ((kept += 1))
                continue
              fi

              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --silent
              echo "Deleted prerelease $tag_name ($published_at)"
              ((deleted += 1))

              # CI tag 与 Release 一一对应；删除它避免 Tags 页面同样累积。
              # tag 仅由短 SHA 组成，不需要额外 URL 编码。
              if gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" \
                --silent; then
                echo "Deleted CI tag $tag_name"
              else
                echo "CI tag $tag_name was already absent"
              fi
            done < <(
              gh api \
                --paginate \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[] | select(.prerelease) | [.published_at, .id, .tag_name] | @tsv' |
              sort -r
            )

            echo "Prefix $prefix: kept $kept CI prereleases; deleted $deleted"
          done

          # Fallback: keep latest 2 for any other prerelease tag that matches pattern "*-ci-*"
          declare -A fallback_kept=()
          fallback_deleted=0
          while IFS=$'\t' read -r published_at release_id tag_name; do
            if [[ -z "$release_id" || -z "$tag_name" ]]; then
              continue
            fi

            is_explicit_prefix=0
            for explicit_prefix in "${explicit_prefixes[@]}"; do
              if [[ "$tag_name" == "${explicit_prefix}"* ]]; then
                is_explicit_prefix=1
                break
              fi
            done
            if (( is_explicit_prefix == 1 )); then
              continue
            fi

            ci_prefix="${tag_name%%-ci-*}-ci-"
            if [[ "$ci_prefix" == "${tag_name}" ]]; then
              continue
            fi
            fallback_kept_count="${fallback_kept[$ci_prefix]:-0}"

            if (( fallback_kept_count < retained_per_prefix )); then
              echo "Keeping fallback $tag_name ($published_at)"
              fallback_kept["$ci_prefix"]=$((fallback_kept_count + 1))
              continue
            fi

            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              --silent
            echo "Deleted fallback prerelease $tag_name ($published_at)"
            ((fallback_deleted += 1))

            if gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag_name}" \
              --silent; then
              echo "Deleted fallback CI tag $tag_name"
            else
              echo "Fallback CI tag $tag_name was already absent"
            fi
          done < <(
            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.prerelease and (.tag_name | contains("-ci-"))) | [.published_at, .id, .tag_name] | @tsv' |
            sort -r
          )

          for prefix in "${!fallback_kept[@]}"; do
            echo "Fallback prefix $prefix: kept ${fallback_kept[$prefix]} CI prereleases"
          done
          echo "Fallback CI prereleases deleted: $fallback_deleted"
