name: Tauri macOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tauri-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is the standard Apple Silicon runner.
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          # Keep an Intel build for older Intel Macs.
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (release)
        run: npx tauri build --target "${{ matrix.target }}" --bundles dmg
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"

      - name: Verify bundle architecture and minimum macOS version
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Nine Rings.app"
          BIN="$APP/Contents/MacOS/nine-rings"
          test -f "$BIN"
          file "$BIN"
          file "$BIN" | grep -E "${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}"
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist"

      - name: Collect artifacts
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "=== Bundle tree ==="
          find "$BUNDLE" -type f -ls 2>/dev/null || echo "Bundle dir not found"
          mkdir -p artifacts
          if ls "$BUNDLE/dmg/"*.dmg 2>/dev/null; then
            cp -v "$BUNDLE/dmg/"*.dmg artifacts/
          fi
          ls -lh artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nine-rings-tauri-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
