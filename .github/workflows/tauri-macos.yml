name: Tauri macOS ARM64 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tauri-macos:
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard Apple Silicon runner; avoid the retiring macos-14 image.
          - arch: arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}

      - name: Resolve Rust dependencies
        # Like Windows, resolve the ignored lockfile before computing the cache key.
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: 'src-tauri -> target'
          key: macos-${{ matrix.arch }}-release-v1
          cache-bin: false
          cache-workspace-crates: false
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (release)
        # Override only this ARM64 bundle; leave other platform builds unchanged.
        run: |
          npx tauri build --target "${{ matrix.target }}" --bundles dmg \
            --config "{\"bundle\":{\"macOS\":{\"minimumSystemVersion\":\"$MACOSX_DEPLOYMENT_TARGET\"}}}" \
            -- --locked

      - name: Verify bundle architecture and minimum macOS version
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet || true
            rmdir "$MOUNT_POINT" || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          BIN="$(find "$APP/Contents/MacOS" -type f -print -quit)"
          test -n "$BIN"
          file "$BIN"
          ARCHES="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHES"
          test "$ARCHES" = "arm64"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "Minimum macOS version: $MIN_OS"
          test "$MIN_OS" = "$MACOSX_DEPLOYMENT_TARGET"

          cleanup
          trap - EXIT

      - name: Collect artifacts
        run: |
          set -euo pipefail
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "=== Bundle tree ==="
          find "$BUNDLE" -type f -ls 2>/dev/null || echo "Bundle dir not found"
          mkdir -p artifacts
          if ls "$BUNDLE/dmg/"*.dmg 2>/dev/null; then
            cp -v "$BUNDLE/dmg/"*.dmg artifacts/
          fi
          for dmg in artifacts/*.dmg; do
            shasum -a 256 "$dmg" > "$dmg.sha256"
          done
          ls -lh artifacts/

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nine-rings-tauri-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish macOS ARM64 prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="macos-${{ matrix.arch }}-ci-$SHORT_SHA"
          TITLE="Nine Rings macOS ARM64 $SHORT_SHA"
          NOTES="macOS Apple Silicon (ARM64) Tauri CI build for commit $GITHUB_SHA.

          This build is not notarized with an Apple Developer certificate. The SHA-256 checksum is attached alongside the DMG."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi
