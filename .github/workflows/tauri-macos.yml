name: Tauri macOS Build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 is the standard Apple Silicon runner.
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri (release)
        run: npx tauri build --target "${{ matrix.target }}" --bundles dmg
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"

      - name: Verify bundle architecture and minimum macOS version
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$DMG"

          MOUNT_POINT="$(mktemp -d)"
          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet || true
            rmdir "$MOUNT_POINT" || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT_POINT"
          APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          BIN="$(find "$APP/Contents/MacOS" -type f -print -quit)"
          test -n "$BIN"
          file "$BIN"
          ARCHES="$(lipo -archs "$BIN")"
          echo "Architectures: $ARCHES"
          echo "$ARCHES" | grep -qw "${{ matrix.target == 'aarch64-apple-darwin' && 'arm64' || 'x86_64' }}"
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")"
          echo "Minimum macOS version: $MIN_OS"
          test "$MIN_OS" = "10.13"

          cleanup
          trap - EXIT

      - name: Collect artifacts
        run: |
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          echo "=== Bundle tree ==="
          find "$BUNDLE" -type f -ls 2>/dev/null || echo "Bundle dir not found"
          mkdir -p artifacts
          if ls "$BUNDLE/dmg/"*.dmg 2>/dev/null; then
            cp -v "$BUNDLE/dmg/"*.dmg artifacts/
          fi
          ls -lh artifacts/

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: nine-rings-tauri-macos-${{ matrix.arch }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
