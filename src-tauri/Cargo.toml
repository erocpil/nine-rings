[package]
name = "nine-rings"
version = "0.1.0"
edition = "2021"

[lib]
name = "nine_rings_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep these minor versions aligned with the JS packages in package-lock.json.
# Tauri checks major/minor parity before building; allow patch updates only.
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-dialog = "~2.7"
tauri-plugin-http = "~2.5"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSScreen", "NSView", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSNotification", "NSOperation", "NSString", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
