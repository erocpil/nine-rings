# Note Sticky — 应用配置定义
# Tauri (Rust)、Web (localStorage)、Flutter (shared_preferences) 三方共用

AppConfig:
  description: 应用全局配置
  persistence: 本地持久化，各端独立。不参与同步
  fields:
    hierarchy_path_mode:
      type: enum(off, default, custom)
      default: default
      description: 文档树目录路径层次配色模式，不影响末端文档名称

    hierarchy_path_custom_colors:
      type: array(color)
      default: ["#247F7B", "#9A5B00", "#5266A8", "#5E7C36", "#8356A1", "#B0473C"]
      description: 文档树路径各层自定义颜色，按六层循环

    hierarchy_outline_mode:
      type: enum(off, default, custom)
      default: default
      description: 文档目录标题层次配色模式

    hierarchy_outline_custom_colors:
      type: array(color)
      default: ["#247F7B", "#9A5B00", "#5266A8", "#5E7C36", "#8356A1", "#B0473C"]
      description: 文档目录各层自定义颜色，按六层循环

    interface_style:
      type: enum(classic, calm, calm-compact, paper, minimal, nine-rings, mono-aware, yugen, wabi-sabi)
      default: classic
      description: Web/Tauri 界面风格，经典采用自定义外观，清雅系列采用完整外观预设

    interface_color_mode:
      type: enum(light, dark, system)
      default: light
      description: 非经典风格独立配色模式，默认浅色，不改变经典主题

    interface_font_family:
      type: enum(system, sans, serif, monospace)
      default: system
      description: 非经典风格正文字体

    interface_font_size:
      type: integer
      default: 16
      min: 12
      max: 32
      description: 非经典风格正文字号（px）

    interface_line_height:
      type: number
      default: 1.8
      min: 1.2
      max: 2.2
      description: 非经典风格正文行距

    interface_block_spacing_px:
      type: integer
      default: 16
      min: 0
      max: 48
      description: 非经典风格顶层正文块间距（px）

    interface_heading_margin_top_px:
      type: integer
      default: 28
      min: 0
      max: 48
      description: 非经典风格标题上间距（px）

    interface_heading_margin_bottom_px:
      type: integer
      default: 12
      min: 0
      max: 32
      description: 非经典风格标题下间距（px）

    interface_content_width:
      type: integer
      default: 0
      min: 0
      max: 1200
      description: 非经典风格桌面正文最大宽度（px），0 表示使用各风格预设

    workspace_layout:
      type: enum(standard, exhibition)
      default: standard
      description: 非经典风格可使用展陈布局，经典暂用标准布局但保留选择

    exhibition_text_width:
      type: enum(narrow, standard, wide)
      default: wide
      description: 桌面展陈正文宽度（690px、窄幅与宽幅的中点、铺满可用宽度），默认宽幅，手机不应用

    exhibition_density:
      type: enum(comfortable, compact)
      default: comfortable
      description: 桌面展陈控件与留白密度，默认舒适，手机不应用

    theme:
      type: enum(light, dark, fu, azure, azure-dark, grace, sui, zhi)
      default: dark
      description: 主题配色

    auto_clean_days:
      type: integer
      default: 30
      min: 0
      max: 365
      description: 回收站自动清理天数。0 表示不自动清理

    note_font_size:
      type: integer
      default: 16
      min: 12
      max: 32
      description: 编辑器正文字号

    editor_font_family:
      type: enum(system, sans, serif, monospace)
      default: system
      description: 编辑器正文字体族

    editor_line_height:
      type: number
      default: 1.6
      min: 1.2
      max: 2.2
      description: 编辑器正文行距

    editor_block_spacing:
      type: number
      default: 1
      min: 0
      max: 3
      description: 相邻顶层正文段落之间的距离（em）

    editor_block_number_gap:
      type: integer
      default: 8
      min: 4
      max: 32
      description: 桌面渲染视图块号与正文间距（px）

    editor_paragraph_indent:
      type: number
      default: 0
      min: 0
      max: 2
      description: 顶层正文段落首行缩进（em）

    editor_heading_margin_top:
      type: number
      default: 0.7
      min: 0
      max: 2
      description: 各级标题与前一块的间距（em）

    editor_heading_margin_bottom:
      type: number
      default: 0.35
      min: 0
      max: 1.5
      description: 各级标题与后一块的间距（em）

    editor_list_margin_top:
      type: number
      default: 0.25
      min: 0
      max: 2
      description: 顶层列表与前一块的间距（em）

    editor_list_margin_bottom:
      type: number
      default: 0.25
      min: 0
      max: 1.5
      description: 顶层列表与后一块的间距（em）

    editor_list_indent:
      type: number
      default: 1.25
      min: 1
      max: 3
      description: 每一级列表缩进（em）

    editor_list_marker_gap:
      type: number
      default: 0.2
      min: 0.1
      max: 0.8
      description: 无序列表圆点与文字间距（em）

    editor_blockquote_indent:
      type: integer
      default: 12
      min: 4
      max: 32
      description: 引用块左侧内缩（px）

    editor_search_highlight_color:
      type: color
      default: "#ffd54f"
      description: 编辑器内搜索关键字高亮色

    editor_cjk_spacing:
      type: boolean
      default: true
      description: 在汉字与英文、数字之间增加仅用于渲染的视觉间距

    highlight_active_line:
      type: boolean
      default: true
      description: 高亮编辑器中光标所在的顶层块

    editor_show_line_numbers:
      type: boolean
      default: false
      description: 在正文左侧显示顶层块编号

    editor_fold_icon_style:
      type: enum(chevron, triangle, custom)
      default: chevron
      description: 文本区、代码和引用块及文档目录的折叠标识样式

    editor_fold_icon_collapsed:
      type: string
      default: "▶"
      description: 自定义收起状态的符号（点击可展开）

    editor_fold_icon_expanded:
      type: string
      default: "▼"
      description: 自定义展开状态的符号（点击可收起）

    editor_show_status_block_number:
      type: boolean
      default: true
      description: 在编辑器状态栏显示光标所在块及总块数

    editor_show_status_bar:
      type: boolean
      default: true
      description: 显示编辑器底部状态栏

    editor_readonly_heading_fold:
      type: boolean
      default: true
      description: 只读文档在专注模式下允许双击标题或正文折叠所属章节（桌面端与 PWA）

    editor_vim_mode:
      type: boolean
      default: false
      description: 启用实验性的 Vim 模式编辑

    editor_code_wrap_default:
      type: boolean
      default: true
      description: 新建代码块默认启用视觉软换行，不改变代码内容

    use_custom_context_menu:
      type: boolean
      default: true
      description: 正文编辑器使用软件内置右键菜单

    user_name:
      type: string
      default: ""
      description: 用户姓名，用作文档作者默认值

    user_organization:
      type: string
      default: ""
      description: 用户所属组织，用作文档组织默认值

    user_email:
      type: string
      default: ""
      description: 用户邮箱，用作文档联系信息默认值

    user_website:
      type: string
      default: ""
      description: 用户网站，用作文档作者主页默认值

    user_copyright:
      type: string
      default: ""
      description: 默认版权声明

    user_default_language:
      type: string
      default: zh-CN
      description: 默认文档语言

    user_default_license:
      type: string
      default: ""
      description: 默认文档许可证

    dev_port:
      type: integer
      default: 1420
      description: Web 开发服务器端口（仅 web 模式生效）
