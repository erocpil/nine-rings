# Note Sticky — 应用配置定义
# Tauri (Rust)、Web (localStorage)、Flutter (shared_preferences) 三方共用

AppConfig:
  description: 应用全局配置
  persistence: 本地持久化，各端独立。不参与同步
  fields:
    theme:
      type: enum(light, dark, fu, azure, azure-dark, grace, sui, zhi)
      default: dark
      description: 主题配色

    default_view:
      type: enum(daily, list)
      default: daily
      description: 默认视图：daily = 每日聚合，list = 全部列表

    todo_carryover_default:
      type: boolean
      default: false
      description: 新建每日页时默认是否开启待办跨日继承

    auto_clean_days:
      type: integer
      default: 30
      min: 0
      max: 365
      description: 回收站自动清理天数。0 表示不自动清理

    note_font_size:
      type: integer
      default: 16
      min: 12
      max: 32
      description: 编辑器正文字号

    editor_font_family:
      type: enum(system, sans, serif, monospace)
      default: system
      description: 编辑器正文字体族

    editor_line_height:
      type: number
      default: 1.6
      min: 1.2
      max: 2.2
      description: 编辑器正文行距

    editor_block_spacing:
      type: number
      default: 1
      min: 0
      max: 3
      description: 相邻顶层正文段落之间的距离（em）

    editor_paragraph_indent:
      type: number
      default: 0
      min: 0
      max: 2
      description: 顶层正文段落首行缩进（em）

    editor_heading_margin_top:
      type: number
      default: 0.7
      min: 0
      max: 2
      description: 各级标题与前一块的间距（em）

    editor_heading_margin_bottom:
      type: number
      default: 0.35
      min: 0
      max: 1.5
      description: 各级标题与后一块的间距（em）

    editor_list_margin_top:
      type: number
      default: 0.25
      min: 0
      max: 2
      description: 顶层列表与前一块的间距（em）

    editor_list_margin_bottom:
      type: number
      default: 0.25
      min: 0
      max: 1.5
      description: 顶层列表与后一块的间距（em）

    editor_list_indent:
      type: number
      default: 1.25
      min: 1
      max: 3
      description: 每一级列表缩进（em）

    editor_list_marker_gap:
      type: number
      default: 0.2
      min: 0.1
      max: 0.8
      description: 无序列表圆点与文字间距（em）

    editor_blockquote_indent:
      type: integer
      default: 12
      min: 4
      max: 32
      description: 引用块左侧内缩（px）

    editor_search_highlight_color:
      type: color
      default: "#ffd54f"
      description: 编辑器内搜索关键字高亮色

    editor_cjk_spacing:
      type: boolean
      default: true
      description: 在汉字与英文、数字之间增加仅用于渲染的视觉间距

    highlight_active_line:
      type: boolean
      default: true
      description: 高亮编辑器中光标所在的顶层块

    editor_show_line_numbers:
      type: boolean
      default: false
      description: 在正文左侧显示顶层块编号

    editor_show_status_block_number:
      type: boolean
      default: true
      description: 在编辑器状态栏显示光标所在块及总块数

    editor_vim_mode:
      type: boolean
      default: false
      description: 启用实验性的 Vim 模式编辑

    use_custom_context_menu:
      type: boolean
      default: true
      description: 正文编辑器使用软件内置右键菜单

    dev_port:
      type: integer
      default: 1420
      description: Web 开发服务器端口（仅 web 模式生效）
